name: CI

# push / pull_request: schema checks, lint, TE and APA unit tests and stub runs of the test profile
# workflow_dispatch:   real runs of the test profile with Docker (tiny dataset on Zenodo): FASTQ input,
#                      BAM input, a single condition and three conditions
# The test data are downloaded once per job by tests/fetch_test_data.sh (with retries and md5 check) and
# used through -c test_data/local.config: Zenodo rate-limits shared runner IPs, and a refused request
# would otherwise fail the parameter validation ("... does not exist").

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  NXF_VER: "25.10.0"       # keep in sync with manifest.nextflowVersion and the README
  NXF_ANSI_LOG: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Schema, lint, unit tests and stub run
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}

      - name: Check that the JSON schemas are valid (draft 2020-12)
        run: |
          python3 -m pip install --quiet jsonschema
          python3 - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          for path in ["nextflow_schema.json", "assets/schema_input.json"]:
              Draft202012Validator.check_schema(json.load(open(path)))
              print(f"{path}: valid")
          PY

      - name: Parameter schema is usable by nf-schema (--help)
        # nf-schema cancels the session after printing the help, so the exit status is 1 by design:
        # check the printed help instead
        run: |
          nextflow run main.nf --help > help.txt 2>&1 || true
          cat help.txt
          grep -q "Input/output options" help.txt
          ! grep -q "ERROR" help.txt

      - name: Nextflow lint
        run: nextflow lint main.nf modules nextflow.config conf

      - name: TE analysis unit test (BusyBox awk in the bedtools container)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" \
            quay.io/biocontainers/bedtools:2.31.1--h13024bc_3 sh tests/te_unit/run_te_unit_test.sh

      - name: APA unit test (internal priming and PAS clustering, IsoformSwitchAnalyzeR container)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:$PWD" -w "$PWD" \
            quay.io/biocontainers/bioconductor-isoformswitchanalyzer:2.6.0--r44h3df3fcb_0 sh tests/apa_unit/run_apa_unit_test.sh

      - name: Download the test data from Zenodo (retries, md5 check)
        run: sh tests/fetch_test_data.sh test_data

      - name: Stub run (-profile test,docker -stub)
        run: nextflow run main.nf -profile test,docker -c test_data/local.config -stub --outdir results_stub

      - name: Stub run with SQANTI3 and a design covariate
        run: |
          nextflow run main.nf -profile test,docker -c test_data/local.config -stub --outdir results_stub_cov \
            --samplesheet test_data/samplesheet_test_covariates.csv --design '~ batch + condition' --run_sqanti3
          test -s results_stub_cov/sqanti3/sqanti3_category_counts.tsv
          test -s results_stub_cov/suppa2/diffsplice/suppa2_diffsplice_significant.tsv

      - name: Stub run with relaxed sample/condition names and a numeric covariate
        run: |
          nextflow run main.nf -profile test,docker -c test_data/local.config -stub --outdir results_stub_names \
            --samplesheet test_data/samplesheet_test_names_numeric.csv --reference_condition ctrl-1 \
            --design '~ rin + condition' --numeric_covariates rin

  test:
    name: Real runs of the test profile (Docker)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # GitHub-hosted runners have ~14 GB of free disk; the containers need several GB.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}

      - name: Download the test data from Zenodo (retries, md5 check)
        run: sh tests/fetch_test_data.sh test_data

      - name: Run the test profile (FASTQ input)
        run: nextflow run main.nf -profile test,docker -c test_data/local.config --outdir results_test

      # BAM input: the BAMs are placed outside the launch and work directories, so that every task must
      # reach them through the paths Nextflow mounts (no dangling symbolic links)
      - name: Run the test profile (BAM input)
        run: |
          mkdir -p /tmp/nli_bam_inputs
          echo "sample,bam,condition" > /tmp/nli_bam_inputs/samplesheet.csv
          for s in GM12878_rep1 GM12878_rep2 H1_rep1 H1_rep2; do
            cp results_test/minimap2/$s.sorted.bam /tmp/nli_bam_inputs/$s.bam
            case $s in H1*) c=treatment ;; *) c=control ;; esac
            echo "$s,/tmp/nli_bam_inputs/$s.bam,$c" >> /tmp/nli_bam_inputs/samplesheet.csv
          done
          rm -rf work
          nextflow run main.nf -profile test,docker -c test_data/local.config -w /tmp/nli_work_bam --input_type bam \
            --samplesheet /tmp/nli_bam_inputs/samplesheet.csv --outdir results_bam
          head -n 1 results_bam/bambu/counts_transcript.txt | grep -q GM12878_rep1
          for s in GM12878_rep1 GM12878_rep2 H1_rep1 H1_rep2; do test -s results_bam/junctions/$s.junctions.tsv; done
          test -s results_bam/proactiv/promoter_counts.tsv
          rm -rf /tmp/nli_work_bam

      - name: Run the test profile (single condition, 2 replicates)
        run: |
          nextflow run main.nf -profile test,docker -c test_data/local.config -w /tmp/nli_work_single \
            --samplesheet test_data/samplesheet_test_single.csv --outdir results_single
          grep -q Message results_single/DE_genes/DE_results.csv
          grep -q Message results_single/isoswitch/significant_switches.csv
          rm -rf /tmp/nli_work_single

      - name: Run the test profile (three conditions, 2 replicates each)
        run: |
          nextflow run main.nf -profile test,docker -c test_data/local.config -w /tmp/nli_work_3cond \
            --samplesheet test_data/samplesheet_test_3cond.csv --outdir results_3cond
          for c in treatment other; do
            test -s results_3cond/DE_genes/DE_results_${c}_vs_control.csv
            test -s results_3cond/suppa2/diffsplice/${c}_vs_control.dpsi
          done
          rm -rf /tmp/nli_work_3cond

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            results_*/pipeline_info/
            results_*/multiqc/
            .nextflow.log*
